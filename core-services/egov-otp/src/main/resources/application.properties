server.port=8089
server.context-path=/otp
server.servlet.context-path=/otp
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database=postgresql
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.22.23:5432/ilmsegov}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.user=${SPRING_FLYWAY_USER:postgres}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:postgres}
spring.flyway.outOfOrder=true
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://192.168.22.23:5432/ilmsegov}
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.table=egov_otp_schema
app.timezone=UTC

management.endpoints.web.base-path=/

egov.otp.length=6
egov.otp.ttl=900
egov.otp.encrypt=true

