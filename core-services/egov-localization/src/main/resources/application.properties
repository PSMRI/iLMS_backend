spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database=postgresql

spring.flyway.user=${SPRING_FLYWAY_USERNAME:postgres}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:postgres}
spring.flyway.outOfOrder=true
spring.flyway.table=egov_localization_schema_version
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://192.168.22.23:5432/egovdb}
spring.flyway.locations=classpath:/db/migration/ddl
spring.flyway.enabled=false

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.22.23:5432/egovdb}

server.port=8087
server.context-path=/localization
server.servlet.context-path=/localization


logging.pattern.console=%clr(%X{CORRELATION_ID:-}) %clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

spring.redis.host=${SPRING_REDIS_HOST:192.168.22.23}
spring.redis.port=${SPRING_REDIS_PORT:6379}

app.timezone=UTC
