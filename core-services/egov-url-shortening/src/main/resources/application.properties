server.port = 8091
server.contextPath=/egov-url-shortening
server.context-path=/egov-url-shortening
server.servlet.context-path=/egov-url-shortening

# spring.redis.host=localhost
# spring.redis.port=6379
spring.redis.host=${SPRING_REDIS_HOST:192.168.22.23}
spring.redis.port=${SPRING_REDIS_PORT:6379}

app.timezone=UTC

spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortening
# spring.datasource.username=postgres
# spring.datasource.password=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://192.168.22.23:5432/urlshortening}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

#----------------------------- FLYWAY CONFIGURATIONS ------------------------------#
# spring.flyway.url=jdbc:postgresql://localhost:5432/urlshortening
# spring.flyway.user=postgres
# spring.flyway.password=postgres
spring.flyway.url=${SPRING_FLYWAY_URL:jdbc:postgresql://192.168.22.23:5432/urlshortening}
spring.flyway.user=${SPRING_FLYWAY_USER:postgres}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:postgres}
spring.flyway.table=public
spring.flyway.baseline-on-migrate=true
spring.flyway.outOfOrder=true
spring.flyway.locations=classpath:/db/migration/main
spring.flyway.enabled=true

# KAFKA SERVER CONFIGURATIONS
# kafka.config.bootstrap_server_config=localhost:9092
kafka.config.bootstrap_server_config=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.value-deserializer=org.egov.tracer.kafka.deserializer.HashMapDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.group-id=egov-url-shortening
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.missing-topics-fatal = false


# KAFKA CONSUMER CONFIGURATIONS

kafka.consumer.config.auto_commit=true
kafka.consumer.config.auto_commit_interval=100
kafka.consumer.config.session_timeout=15000
kafka.consumer.config.auto_offset_reset=earliest

# KAFKA PRODUCER CONFIGURATIONS

kafka.producer.config.retries_config=0
kafka.producer.config.batch_size_config=16384
kafka.producer.config.linger_ms_config=1
kafka.producer.config.buffer_memory_config=33554432

url.shorten.indexer.topic=save-url-shortening-deatils

db.persistance.enabled=true

# host.name=https://qa.digit.org/
# egov.user.host=http://egov-user.egov:8080/
host.name=${HOST_NAME:https://qa.digit.org/}
egov.user.host=${EGOV_USER_HOST:http://egov-user.egov:8080/}
egov.user.search.path=user/_search
state.level.tenant.id=pb

hashids.salt=randomsalt
hsahids.min.length=3